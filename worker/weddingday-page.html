<style>
  :root {
    --paper:     #F2F3EA;
    --ink:       #26362D;
    --muted:     #526158;
    --sage:      #86A08D;
    --sage-deep: #4C6455;
    --gold:      #9A7B3F;
    --serif: "Cormorant Garamond", "Iowan Old Style", Georgia, serif;
    --sans:  "Jost", "Avenir Next", "Segoe UI", system-ui, sans-serif;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper:     #161F1A;
      --ink:       #ECEDE2;
      --muted:     #A9B5AB;
      --sage:      #7F9986;
      --sage-deep: #9DB6A4;
      --gold:      #C9AD6B;
    }
  }

  *, *::before, *::after { box-sizing: border-box; }
  html { height: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    min-height: 100svh;
    display: flex;
    flex-direction: column;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    font-weight: 300;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: max(2rem, env(safe-area-inset-top)) 1.25rem 1rem;
    text-align: center;
  }

  .rings {
    width: clamp(64px, 12vw, 96px);
    height: auto;
    margin-bottom: 1.75rem;
    opacity: 0.9;
  }
  .rings circle {
    fill: none;
    stroke: var(--sage-deep);
    stroke-width: 2;
  }
  .rings circle.gold {
    stroke: var(--gold);
  }

  h1 {
    font-family: var(--serif);
    font-weight: 400;
    font-size: clamp(2.6rem, 9vw, 4.25rem);
    line-height: 1.06;
    letter-spacing: 0.01em;
    margin: 0 0 0.45em;
    color: var(--ink);
  }
  h1 em {
    font-style: italic;
    color: var(--sage-deep);
  }

  p.names {
    font-family: var(--serif);
    font-size: clamp(1.5rem, 5vw, 2.1rem);
    letter-spacing: 0.06em;
    margin: 0 0 0.5em;
    color: var(--sage-deep);
  }
  p.date {
    margin: 0 0 2.2em;
    font-size: 0.95rem;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--gold);
  }

  .venues {
    display: grid;
    gap: 1rem;
    width: 100%;
    max-width: 30rem;
    margin-bottom: 2rem;
  }
  .venue {
    display: flex;
    flex-direction: column;
    gap: 0.15rem;
    background: color-mix(in srgb, var(--paper) 60%, transparent);
    border: 1px solid color-mix(in srgb, var(--sage) 45%, transparent);
    border-radius: 14px;
    padding: 0.9rem 1.25rem;
  }
  .venue-label {
    font-size: 0.75rem;
    letter-spacing: 0.26em;
    text-transform: uppercase;
    color: var(--gold);
  }
  .venue-name {
    font-family: var(--serif);
    font-size: 1.25rem;
    color: var(--ink);
  }

  p.message {
    max-width: 34rem;
    margin: 0;
    font-size: 1.05rem;
    line-height: 1.7;
    color: var(--muted);
  }
</style>
</head>
<body>
<main>
  <svg class="rings" viewBox="0 0 120 96" aria-hidden="true">
    <circle cx="44" cy="52" r="34"/>
    <circle class="gold" cx="78" cy="40" r="34"/>
  </svg>
  <h1><em>Today&rsquo;s</em> the day!</h1>
  <p class="names">Partner One &amp; Partner Two</p>
  <!-- The live page renders the wedding date here, plus the ceremony and
       reception venues from the couple's plan setup. -->
  <p class="date">[wedding date]</p>
  <div class="venues">
    <div class="venue"><span class="venue-label">Ceremony</span><span class="venue-name">Ceremony venue</span></div>
    <div class="venue"><span class="venue-label">Reception</span><span class="venue-name">Reception venue</span></div>
  </div>
  <p class="message">Thank you for being a part of our day. We can&rsquo;t wait to celebrate with you.</p>
</main>
</body>
</html>
